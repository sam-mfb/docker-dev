set -g default-terminal "screen-256color"

set -g prefix C-a
unbind C-b

setw -g mode-keys vi

bind-key -r C-k resize-pane -U 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-h resize-pane -L 10
bind-key -r C-l resize-pane -R 10

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
"bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
"bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# open new windows/panes using the current path rather than default path
unbind c
bind c new-window -c "#{pane_current_path}"
unbind '"'
bind '"' split-window -v -c "#{pane_current_path}"

unbind %
bind % split-window -h -c "#{pane_current_path}"

# Sessions
# prefix N: name a new session and switch to it, starting in the current
# directory. A name that already exists switches to that session.
bind N command-prompt -p "New session name:" "new-session -A -s '%%' -c '#{pane_current_path}'"
# prefix s: choose a session, with a preview (tmux's default, kept here as a reminder).
bind s choose-tree -Zs
# prefix Tab: back to the previous session (same as tmux's default prefix L).
bind Tab switch-client -l

# Show the session name prominently.
set -g status-left ' [#S] '
set -g status-left-length 40

# Each session gets its own status bar color, cycling through colors 9-14 by
# session number. The current window is shown inverted (session color on
# black), so it drops tmux's * flag; other flags, such as Z for zoom, stay.
set -g status-style 'bg=colour#{e|+:9,#{e|m:#{s/[$]//:session_id},6}},fg=black'
set -g window-status-current-style 'reverse,bold'
set -g window-status-current-format '#I:#W#{s/[*]//:window_flags}'

# A window whose program rang the bell keeps the session color (tmux's default
# swaps the colors) and gets a bold ● before its name, plus tmux's ! after it.
set -g window-status-bell-style default
set -g window-status-activity-style default
set -g window-status-format '#I:#{?window_bell_flag,#[bold]● #[nobold],}#W#{?window_flags,#{window_flags}, }'

# Set pane border colors
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour24

